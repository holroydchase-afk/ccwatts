# Weekly dependency updates, grouped so minor and patch bumps arrive as one PR per ecosystem.
# Majors come one PR each. Bot PRs skip the agents-check and handoff-check workflows.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        update-types: ["minor", "patch"]
