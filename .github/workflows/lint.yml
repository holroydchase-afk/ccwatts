# Studio lint gate. Warnings only until the repo is clean; then set the repository variable
# STUDIO_LINT_STRICT to 1 so findings fail CI.
name: lint
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  eslint:
    runs-on: ubuntu-latest
    env:
      STUDIO_LINT_STRICT: ${{ vars.STUDIO_LINT_STRICT == '1' && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
