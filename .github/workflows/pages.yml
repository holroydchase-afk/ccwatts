# Publishes the playground (packages/web/dist/ccwatts.html) to GitHub Pages after CI passes on a push to main.
# Needs Settings → Pages → Source: "GitHub Actions" turned on once.
name: Playground

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Only a successful CI run on a push to main (not a PR from a branch named main), or a manual run on main.
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Stage the site
        run: |
          mkdir -p site
          cp packages/web/dist/ccwatts.html site/index.html
          cp packages/web/public/og.png site/og.png
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # LIVE-CHECK: load the deployed page like a visitor (phone and laptop width) and fail the run if it
  # isn't the real thing: scripts/check-live.ts. Reads only; the page request is the only traffic.
  live-check:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright (outside the repo, not a project dependency)
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save playwright@1.64.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps --only-shell chromium
      - name: The live playground works
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/pw/node_modules/playwright/index.mjs
        # Pages' CDN caches for up to 10 minutes (max-age=600), so retry for about 11 before failing.
        run: |
          for attempt in $(seq 1 12); do
            npm run check:live && exit 0
            [ "$attempt" -lt 12 ] || break
            echo "Attempt $attempt failed; retrying in 60 s"
            sleep 60
          done
          exit 1
