# Publishes the CLI (packages/cli) to npm. Runs only when started by hand:
# Actions → "Publish to npm" → Run workflow, then type the version to confirm.
# Publishes through npm trusted publishing (OIDC, set up Oct 28 for this
# workflow, "npm publish" only). There is no npm token or secret.
name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      confirm_version:
        description: "Type the version in packages/cli/package.json to confirm (e.g. 0.1.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance and trusted publishing
    steps:
      - name: Publish only from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Publish only from main (this run is on $GITHUB_REF). Nothing was published."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24 # npm 11, which trusted publishing needs
          registry-url: https://registry.npmjs.org
      - name: Check the confirmed version
        env:
          CONFIRM: ${{ inputs.confirm_version }}
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          if [ "$CONFIRM" != "$version" ]; then
            echo "::error::You typed '$CONFIRM' but packages/cli/package.json is $version. Nothing was published."
            exit 1
          fi
          if npm view "ccwatts@$version" version >/dev/null 2>&1; then
            echo "::error::ccwatts@$version is already on npm. Bump the version first."
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Publish
        working-directory: packages/cli
        run: npm publish --provenance --access public
