name: handoff-check
# Studio session rule: any PR that changes files also updates HANDOFF.md.
# Put [skip handoff] in the PR title for changes that don't move the work. Bot PRs (Dependabot) are exempt.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
jobs:
  handoff:
    if: ${{ github.event.pull_request.user.type != 'Bot' && !contains(github.event.pull_request.title, '[skip handoff]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: HANDOFF.md updated
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE...$HEAD")
          if [ -z "$changed" ] || echo "$changed" | grep -qx 'HANDOFF.md'; then
            echo "ok"; exit 0
          fi
          echo "::error::This PR changes files but not HANDOFF.md. Update it (done, in progress, exact next step, decisions, blockers), or add [skip handoff] to the title if the change doesn't move the work."
          exit 1
      - name: HANDOFF.md status header
        # Warns, never fails (studio-agents CON-16): the Studio Console reads this header. Set the optional
        # STUDIO_GOALS repo variable (comma list of pm-tools goals.json ids) to check the goal too.
        env:
          GOALS: ${{ vars.STUDIO_GOALS }}
        run: bash scripts/check-handoff-status.sh HANDOFF.md
